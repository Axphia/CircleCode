name: CI & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-test:
    name: Build & Test (Rust WASM + JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile Rust WebAssembly core
        run: |
          cd native/rust
          wasm-pack build --target web --release
          cd ../..
          cp native/rust/pkg/circlecode_core* wasm/

      - name: Build UMD and minified bundles
        run: npm run build

      - name: Run JavaScript test suite
        run: npm test

      - name: Run WebAssembly test suite
        run: npm run test:wasm

  auto-release:
    name: Auto Release & Changelog
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release artifacts
        run: |
          npm install
          cd native/rust
          wasm-pack build --target web --release
          cd ../..
          cp native/rust/pkg/circlecode_core* wasm/
          npm run build
          npm pack

      - name: Generate Changelog & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Target release tag: ${TAG}"

          # Check if release already exists
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists. Skipping release creation."
            exit 0
          fi

          # Find previous tag for commit range comparison
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || echo "")
          echo "Previous tag: ${PREV_TAG:-none}"

          # Generate release notes using Node.js (extracts CHANGELOG.md section + categorized git commits)
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const version = process.argv[1];
            const tag = "v" + version;
            const prevTag = process.argv[2];
            const repo = process.env.GITHUB_REPOSITORY || "Axphia/CircleCode";

            let changelogSection = "";
            if (fs.existsSync("CHANGELOG.md")) {
              const raw = fs.readFileSync("CHANGELOG.md", "utf8");
              const escaped = version.replace(/\./g, "\\.");
              const re = new RegExp(`## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n---\\n|\\n## \\[|$)`);
              const m = raw.match(re);
              if (m && m[1].trim()) {
                changelogSection = m[1].trim();
              }
            }

            const range = prevTag ? `${prevTag}..HEAD` : "HEAD";
            let commits = [];
            try {
              const logOut = execSync(`git log ${range} --pretty=format:"%h|%s|%an"`, { encoding: "utf8" });
              commits = logOut.split("\n").filter(Boolean).map(line => {
                const [hash, subject, author] = line.split("|");
                return { hash, subject, author };
              });
            } catch (e) {}

            const groups = {
              feat: { title: "### 🚀 Features", items: [] },
              fix: { title: "### 🐛 Bug Fixes", items: [] },
              perf: { title: "### ⚡ Performance", items: [] },
              docs: { title: "### 📚 Documentation", items: [] },
              other: { title: "### 🔧 Maintenance & Other Changes", items: [] }
            };

            for (const c of commits) {
              const entry = `- ${c.subject} (\`${c.hash}\`)`;
              if (/^feat(\(|:)/i.test(c.subject)) groups.feat.items.push(entry);
              else if (/^fix(\(|:)/i.test(c.subject)) groups.fix.items.push(entry);
              else if (/^perf(\(|:)/i.test(c.subject)) groups.perf.items.push(entry);
              else if (/^docs(\(|:)/i.test(c.subject)) groups.docs.items.push(entry);
              else groups.other.items.push(entry);
            }

            let notes = `## CircleCode ${tag}\n\n`;
            if (changelogSection) {
              notes += changelogSection + "\n\n";
            }

            const commitBlocks = Object.values(groups)
              .filter(g => g.items.length > 0)
              .map(g => `${g.title}\n${g.items.join("\n")}`)
              .join("\n\n");

            if (commitBlocks) {
              notes += `## 📋 Commit Log\n\n${commitBlocks}\n\n`;
            }

            notes += `## 📦 Quick Installation\n\n`;
            notes += "```bash\nnpm install @axphia/circlecode@" + version + "\n```\n\n";
            notes += "```html\n<script src=\"https://cdn.jsdelivr.net/npm/@axphia/circlecode@" + version + "/dist/circlecode.min.js\"></script>\n```\n\n";

            if (prevTag) {
              notes += `**Full Changelog:** https://github.com/${repo}/compare/${prevTag}...${tag}\n`;
            }

            fs.writeFileSync("RELEASE_NOTES.md", notes, "utf8");
          ' "${VERSION}" "${PREV_TAG}"

          # Create tag if it does not exist on remote
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          # Create GitHub Release with built assets and generated release notes
          gh release create "${TAG}" \
            dist/circlecode.umd.js \
            dist/circlecode.min.js \
            index.cjs \
            wasm/circlecode_core_bg.wasm \
            *.tgz \
            --title "Release ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@axphia'

      - name: Install dependencies & Build
        run: |
          npm install
          cd native/rust
          wasm-pack build --target web --release
          cd ../..
          cp native/rust/pkg/circlecode_core* wasm/
          npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@axphia/circlecode';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --access public || echo "Publish completed or version already exists"

  publish-npm:
    name: Publish to NPM Registry
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm to latest for OIDC support
        run: sudo npm install -g npm@latest

      - name: Build & Publish to npm via Trusted Publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install
          cd native/rust
          wasm-pack build --target web --release
          cd ../..
          cp native/rust/pkg/circlecode_core* wasm/
          npm run build
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @axphia/circlecode version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $CURRENT_VERSION is already published to npm registry. Skipping publish."
            exit 0
          fi
          npm publish --provenance --access public || npm publish --access public
