[package]
name = "circlecode-core"
version = "1.0.0"
edition = "2021"
authors = ["Axphia Project"]
description = "High-performance Rust/WASM circular barcode scanning engine"
license = "MIT"
repository = "https://github.com/Axphia/CircleCode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
