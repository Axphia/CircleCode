[package]
name = "circlecode-core"
version = "1.1.8"
edition = "2021"
authors = ["Axphia Project"]
description = "High-performance Rust/WASM and Native C FFI/JNI circular barcode encoder & decoder"
license = "MIT"
repository = "https://github.com/Axphia/CircleCode"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
