<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CircleCode — WebAssembly (Rust) Acceleration</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --text-sec: #86868b;
      --accent: #0071e3;
      --border: rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card);
      border-radius: var(--radius);
      padding: 36px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 113, 227, 0.1);
      color: var(--accent);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-sec);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .stat-box {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--bg);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-sec);
      margin-top: 4px;
    }

    pre {
      background: #1d1d1f;
      color: #30d158;
      padding: 16px;
      border-radius: 12px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      margin-top: 24px;
      overflow-x: auto;
    .nav {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .nav-brand svg { width: 18px; height: 18px; }
    .nav-links {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .nav-links a {
      color: var(--text-sec);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
  </style>
</head>

<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
      </svg>
      Circle Code
    </a>
    <div class="nav-links">
      <a href="generator.html">Generator</a>
      <a href="scanner.html">JS Scanner</a>
      <a href="scanner-wasm.html">WASM Scanner</a>
      <a href="https://github.com/Axphia/CircleCode">Docs</a>
    </div>
  </nav>

  <div class="container">
    <div class="badge">Rust + WebAssembly</div>
    <h1>CircleCode WASM Engine</h1>
    <p>High-performance native WebAssembly core compiled from Rust with zero JavaScript garbage collection pauses.</p>

    <button id="runBtn" class="btn">Run WASM Benchmark (400x400 Frame)</button>

    <div class="stat-box">
      <div class="stat-card">
        <div class="stat-val" id="timeVal">--</div>
        <div class="stat-lbl">Decode Latency</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">33.7 KB</div>
        <div class="stat-lbl">WASM Binary Size</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="fpsVal">--</div>
        <div class="stat-lbl">Max Throughput</div>
      </div>
    </div>

    <pre id="output">Initializing WebAssembly module...</pre>
  </div>

  <script type="module">
    let scan_frame_wasm;
    const out = document.getElementById('output');
    const timeVal = document.getElementById('timeVal');
    const fpsVal = document.getElementById('fpsVal');
    let wasmReady = false;

    async function setup() {
      try {
        let mod;
        try {
          mod = await import('../wasm/circlecode_core.js');
          await mod.default({ module_or_path: '../wasm/circlecode_core_bg.wasm' });
        } catch (e1) {
          mod = await import('https://cdn.jsdelivr.net/npm/@axphia/circlecode@1.1.5/wasm/circlecode_core.js');
          await mod.default({ module_or_path: 'https://cdn.jsdelivr.net/npm/@axphia/circlecode@1.1.5/wasm/circlecode_core_bg.wasm' });
        }
        scan_frame_wasm = mod.scan_frame_wasm;
        wasmReady = true;
        out.textContent = '✓ WebAssembly module loaded and ready!\nClick button above to benchmark.';
      } catch (e) {
        out.textContent = 'Error loading WASM: ' + e.message;
      }
    }

    function runBenchmark() {
      if (!wasmReady) return;
      const S = 400;
      const rgba = new Uint8Array(S * S * 4).fill(255);
      
      // Central black badge
      const cx = S / 2, cy = S / 2, r = 42;
      for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
          if ((x - cx)**2 + (y - cy)**2 <= r*r) {
            const idx = (y * S + x) * 4;
            rgba[idx] = 20; rgba[idx+1] = 20; rgba[idx+2] = 20; rgba[idx+3] = 255;
          }
        }
      }

      const t0 = performance.now();
      const res = scan_frame_wasm(rgba, S, S, true);
      const t1 = performance.now();

      const ms = t1 - t0;
      timeVal.textContent = ms.toFixed(2) + ' ms';
      fpsVal.textContent = Math.round(1000 / Math.max(ms, 0.1)) + ' FPS';

      out.textContent = '--- Benchmark Complete ---\n'
        + 'Execution Time : ' + ms.toFixed(3) + ' ms\n'
        + 'Result Object  : ' + JSON.stringify(res, null, 2);
    }

    document.getElementById('runBtn').addEventListener('click', runBenchmark);
    setup();
  </script>
</body>

</html>
